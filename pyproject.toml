[build-system]
requires = ["setuptools>=60", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbsim_ngapp_style"
dynamic = ["version"]
description = "CerbSIM design system (themes, tokens, component classes) for ngapp apps"
readme = "README.md"
dependencies = ["ngapp"]

[project.urls]
Repository = "https://github.com/CERBSim/cerbsim_ngapp_style"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/cerbsim_ngapp_style/_version.py"
local_scheme = "no-local-version"
